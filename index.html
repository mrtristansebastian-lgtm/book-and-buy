<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build A Booking gives service businesses a polished booking page, client records, schedules, team tools, and branded communication in one calm workspace." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Build A Booking" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Build A Booking" />
    <meta property="og:description" content="Create a polished booking page and run every request from one sleek business workspace." />
    <meta property="og:type" content="website" />
    <title>Build A Booking</title>
    <link rel="icon" type="image/png" href="/build-a-booking-icon.png" />
    <link rel="apple-touch-icon" href="/build-a-booking-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        window.__buildABookingFontLibrary = "https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap";
        window.__loadBuildABookingFonts = function () {
          if (document.querySelector('link[data-build-a-booking-fonts]')) return;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = window.__buildABookingFontLibrary;
          link.setAttribute('data-build-a-booking-fonts', 'full-library');
          document.head.appendChild(link);
        };
        window.addEventListener('build-a-booking:load-fonts', window.__loadBuildABookingFonts);
      }());
    </script>
  </head>
  <body class="bg-[#FBFBFB] text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
